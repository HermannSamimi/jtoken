[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jtoken"
version = "0.3.4"
description = "Compress JSON-shaped documents for LLM prompts with normalization, CLI, and token measurement"
readme = "README.pypi.md"
requires-python = ">=3.8"
authors = [
    { name = "Hermann Samimi", email = "hermannsamimi@gmail.com" },
]
license = "MIT"
keywords = ["serialization", "encoding", "key-value", "format", "text", "llm", "tokens"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
]

[project.optional-dependencies]
tiktoken = [
    "tiktoken>=0.5",
]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "tiktoken>=0.5",
    "build>=1.0",
]

[project.scripts]
jtoken = "jtoken.cli:main"

[project.urls]
Homepage = "https://github.com/hermannsamimi/jtoken"
Repository = "https://github.com/hermannsamimi/jtoken"
Issues = "https://github.com/hermannsamimi/jtoken/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["jtoken"]
