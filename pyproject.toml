[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jpack"
version = "0.1.0"
description = "A lightweight, human-readable key-value serialization format"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Hermann Samimi", email = "hermannsamimi@gmail.com" },
]
license = { text = "MIT" }
keywords = ["serialization", "encoding", "key-value", "format", "text"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Text Processing :: General",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
]

[project.urls]
Homepage = "https://github.com/hermannsamimi/jpack"
Repository = "https://github.com/hermannsamimi/jpack"
Issues = "https://github.com/hermannsamimi/jpack/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["jpack"]
