[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "langchain-jtoken"
version = "0.1.0"
description = "Compress LangChain Document page_content with jtoken for fewer LLM prompt tokens"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Hermann Samimi", email = "hermannsamimi@gmail.com" }]
dependencies = [
    "jtoken>=0.3.5",
    "langchain-core>=0.3",
]
keywords = ["llm", "langchain", "token-optimization", "json", "rag"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/HermannSamimi/jtoken"
Repository = "https://github.com/HermannSamimi/jtoken"
Issues = "https://github.com/HermannSamimi/jtoken/issues"

[tool.hatch.build.targets.wheel]
packages = ["langchain_jtoken"]

[tool.pytest.ini_options]
testpaths = ["tests"]